name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests bring their own PostgreSQL via Testcontainers (Docker
      # is available on ubuntu runners). Browser (E2E) tests run in the e2e job.
      - name: Test
        run: dotnet test --no-build --configuration Release --filter "Category!=E2E"

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: build-test
    # Smoke is informational while S5-S7 pages land; flip to required at S9.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Start database
        run: docker compose up -d db --wait

      - name: Build
        run: dotnet build --configuration Release

      - name: Install Playwright chromium
        run: pwsh tests/RapidsolDestek.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run app
        run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5310 \
            dotnet run --project src/RapidsolDestek.Web --no-build --configuration Release --no-launch-profile &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5310/login > /dev/null && break
            sleep 2
          done

      - name: E2E smoke
        run: dotnet test tests/RapidsolDestek.E2E --no-build --configuration Release --filter "Category=E2E"
        env:
          E2E_BASE_URL: http://localhost:5310
