  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(()=&gt;{const root=document.getElementById(&#x27;rapidsol-customer&#x27;);const reply=root.querySelector(&#x27;.rc-reply&#x27;);if(!reply||root.querySelector(&#x27;[data-long-example]&#x27;))return;const holder=document.createElement(&#x27;div&#x27;);holder.setAttribute(&#x27;data-long-example&#x27;,&#x27;&#x27;);holder.innerHTML=&#x27;&lt;article class=&quot;rc-message&quot;&gt;&lt;div class=&quot;rc-message-head&quot;&gt;&lt;div class=&quot;rc-avatar&quot;&gt;BS&lt;/div&gt;Bourla Salehi &lt;time&gt;Bugün 11:06&lt;/time&gt;&lt;/div&gt;&lt;p&gt;Merhaba, kontrolü farklı personel grupları ve üç ayrı bordro dönemi üzerinde tekrarladık. Sorun yalnızca yol yardımı ücret türünün geriye dönük tarihli kayıtlarında oluşuyor. Aşağıdaki tabloda örnek personelleri, beklenen ve gerçekleşen tutarları paylaşıyorum. Kişisel veriler güvenlik amacıyla maskelenmiştir.&lt;/p&gt;&lt;table class=&quot;rc-message-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Personel&lt;/th&gt;&lt;th&gt;Bordro dönemi&lt;/th&gt;&lt;th&gt;Beklenen&lt;/th&gt;&lt;th&gt;Gerçekleşen&lt;/th&gt;&lt;th&gt;Fark&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;10••42&lt;/td&gt;&lt;td&gt;Temmuz 2026&lt;/td&gt;&lt;td&gt;1.250,00 ₺&lt;/td&gt;&lt;td&gt;1.875,00 ₺&lt;/td&gt;&lt;td&gt;+625,00 ₺&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;10••87&lt;/td&gt;&lt;td&gt;Temmuz 2026&lt;/td&gt;&lt;td&gt;1.250,00 ₺&lt;/td&gt;&lt;td&gt;2.500,00 ₺&lt;/td&gt;&lt;td&gt;+1.250,00 ₺&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11••03&lt;/td&gt;&lt;td&gt;Haziran 2026&lt;/td&gt;&lt;td&gt;1.100,00 ₺&lt;/td&gt;&lt;td&gt;1.100,00 ₺&lt;/td&gt;&lt;td&gt;0,00 ₺&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;11••19&lt;/td&gt;&lt;td&gt;Ağustos 2026&lt;/td&gt;&lt;td&gt;1.300,00 ₺&lt;/td&gt;&lt;td&gt;1.950,00 ₺&lt;/td&gt;&lt;td&gt;+650,00 ₺&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;rc-message-note&quot;&gt;&lt;b&gt;Ek bilgi:&lt;/b&gt; Aynı personeller için standart ücret simülasyonu doğru sonuç veriyor; fark yalnızca canlı bordro çalıştırmasında oluşuyor. Test ortamında 01.07.2026 tarihli konfigürasyon kopyası kullanıldı.&lt;/div&gt;&lt;p&gt;İnceleme sırasında kullandığımız kontrol dosyasını, ücret türü ekran görüntülerini ve bordro log çıktısını ekliyorum. Gerekirse ilgili dönemin anonimleştirilmiş test verisini de paylaşabiliriz.&lt;/p&gt;&lt;div class=&quot;rc-attachment-group&quot;&gt;&lt;span class=&quot;rc-attachment&quot;&gt;📊 yol-yardimi-karsilastirma.xlsx · 284 KB&lt;/span&gt;&lt;span class=&quot;rc-attachment&quot;&gt;🖼️ konfigürasyon-ekrani.png · 1,8 MB&lt;/span&gt;&lt;span class=&quot;rc-attachment&quot;&gt;📄 bordro-loglari.zip · 4,2 MB&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;rc-message&quot;&gt;&lt;div class=&quot;rc-message-head&quot;&gt;&lt;div class=&quot;rc-avatar&quot;&gt;ÜA&lt;/div&gt;Ümit Yaşar Akın · RapidSol &lt;time&gt;Bugün 12:24&lt;/time&gt;&lt;/div&gt;&lt;p&gt;Detaylı çalışma ve örnekler için teşekkürler. Paylaşılan tablo ile logları karşılaştırdık. İlk bulgularımıza göre geriye dönük kayıtların bölünmesi sırasında aynı ücret türü ikinci kez değerlendirmeye giriyor.&lt;/p&gt;&lt;ol&gt;&lt;li&gt;Ücret türü tarih aralıkları yeniden düzenlenecek.&lt;/li&gt;&lt;li&gt;Temmuz bordrosu seçilen dört personel için simüle edilecek.&lt;/li&gt;&lt;li&gt;Fark oluşmaması halinde toplu regresyon testi çalıştırılacak.&lt;/li&gt;&lt;li&gt;Sonuçlar müşteri testine açılmadan önce kontrol raporu paylaşılacak.&lt;/li&gt;&lt;/ol&gt;&lt;p&gt;Bu düzenleme, test ve sonuç raporu için toplam &lt;b&gt;6 saat&lt;/b&gt; efor öngörüyoruz. Onay sonrasında aynı iş günü içinde çalışmayı başlatabiliriz.&lt;/p&gt;&lt;div class=&quot;rc-attachment-group&quot;&gt;&lt;span class=&quot;rc-attachment&quot;&gt;📄 teknik-inceleme-ve-efor.pdf · 612 KB&lt;/span&gt;&lt;span class=&quot;rc-attachment&quot;&gt;📊 test-senaryolari.xlsx · 96 KB&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;rc-message&quot;&gt;&lt;div class=&quot;rc-message-head&quot;&gt;&lt;div class=&quot;rc-avatar&quot;&gt;BS&lt;/div&gt;Bourla Salehi &lt;time&gt;Bugün 13:02&lt;/time&gt;&lt;/div&gt;&lt;p&gt;Teşekkürler. Efor teklifini ilgili yöneticimizle paylaştım. Onay öncesinde bir noktayı netleştirmek istiyoruz: yapılacak tarih düzenlemesi Ağustos bordrosunda daha önce doğru hesaplanan personelleri etkiler mi? Çalışmanın kapsamına Ağustos dönemi regresyon kontrolünün de dahil olduğunu teyit edebilir misiniz?&lt;/p&gt;&lt;blockquote class=&quot;rc-message-note&quot;&gt;Özellikle 11••19 numaralı personelde Ağustos tutarının tekrar değişmemesi kritik. Bu personelin mevcut doğru sonucu kontrol senaryosuna referans olarak eklenebilir.&lt;/blockquote&gt;&lt;p&gt;Ayrıca toplantıda üzerinden geçtiğimiz ekran görüntüsünün işaretlenmiş sürümünü ve iç onay formumuzu ekliyorum. Yanıtınıza göre efor onayını bu ekran üzerinden tamamlayacağız.&lt;/p&gt;&lt;div class=&quot;rc-attachment-group&quot;&gt;&lt;span class=&quot;rc-attachment&quot;&gt;🖼️ isaretli-ekran-goruntusu.png · 2,1 MB&lt;/span&gt;&lt;span class=&quot;rc-attachment&quot;&gt;📄 ic-onay-formu.pdf · 348 KB&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;&#x27;;reply.before(holder);})();(()=&gt;{const root=document.getElementById(&#x27;rapidsol-customer&#x27;);const map={&#x27;Ana Sayfa&#x27;:&#x27;Home&#x27;,&#x27;Yeni Talep&#x27;:&#x27;New Request&#x27;,&#x27;Taleplerim (4)&#x27;:&#x27;My Requests (4)&#x27;,&#x27;Taleplerim&#x27;:&#x27;My Requests&#x27;,&#x27;Yeni destek talebi&#x27;:&#x27;New support request&#x27;,&#x27;＋ Yeni destek talebi&#x27;:&#x27;＋ New support request&#x27;,&#x27;＋ Yeni talep&#x27;:&#x27;＋ New request&#x27;,&#x27;RapidSol Çözüm Merkezi’ne hoş geldiniz&#x27;:&#x27;Welcome to the RapidSol Solution Center&#x27;,&#x27;Yeni bir destek talebi oluşturabilir veya mevcut taleplerinizin güncel durumunu takip edebilirsiniz.&#x27;:&#x27;Create a new support request or track your existing requests.&#x27;,&#x27;Açık taleplerim&#x27;:&#x27;My open requests&#x27;,&#x27;2 talepte RapidSol çalışıyor&#x
