<body class="backoffice" data-panel="admin" data-nav="departments">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">

  <div class="bo-page-head">
    <div>
      <p><a href="departments.html" data-i18n="de.back"></a></p>
      <h1>Destek / Bordro</h1>
      <p data-i18n="de.subtitle"></p>
    </div>
  </div>

  <form>
    <div class="rd-tabs" data-tabs data-tabs-scope="main">
      <button type="button" class="active" data-tab="panel-settings" data-i18n="de.tabSettings"></button>
      <button type="button" data-tab="panel-access" data-i18n="de.tabAccess"></button>
    </div>

    <!-- ============ Ayarlar ============ -->
    <div class="rd-tab-panel active" id="panel-settings" data-tab-group="main">

      <div class="rd-surface" style="margin-bottom:18px">
        <div class="rd-surface-head" data-i18n="de.secGeneral"></div>
        <div class="rd-surface-body">
          <div class="rd-grid-2">
            <div class="rd-field">
              <label class="rd-label" for="de-parent" data-i18n="de.parent"></label>
              <select id="de-parent" class="rd-control">
                <option data-i18n="de.noParent"></option>
                <option selected>Destek</option>
                <option>Danışmanlık</option>
              </select>
              <p class="rd-help" data-i18n="de.parentHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="de-name" data-i18n="de.name"></label>
              <input id="de-name" class="rd-control" type="text" value="Bordro">
              <p class="rd-help" data-i18n="de.nameHelp"></p>
            </div>
          </div>
          <div class="rd-grid-2">
            <div class="rd-field">
              <label class="rd-label" for="de-status" data-i18n="de.statusLabel"></label>
              <select id="de-status" class="rd-control">
                <option selected data-i18n="de.stActive"></option>
                <option data-i18n="de.stDisabled"></option>
                <option data-i18n="de.stArchived"></option>
              </select>
              <p class="rd-help" data-i18n="de.statusHelp"></p>
            </div>
            <div class="rd-field">
              <span class="rd-label" data-i18n="de.visibility"></span>
              <label class="rd-check" style="display:inline-flex;margin-right:18px;margin-top:10px">
                <input type="radio" name="de-vis" checked><span data-i18n="de.visPublic"></span>
              </label>
              <label class="rd-check" style="display:inline-flex">
                <input type="radio" name="de-vis"><span data-i18n="de.visPrivate"></span>
              </label>
              <p class="rd-help" data-i18n="de.visibilityHelp"></p>
            </div>
          </div>
          <div class="rd-grid-2">
            <div class="rd-field">
              <label class="rd-label" for="de-sla" data-i18n="de.sla"></label>
              <select id="de-sla" class="rd-control">
                <option data-i18n="de.sysDefault"></option>
                <option selected>Standart — 48 saat</option>
                <option>VIP — 8 saat</option>
              </select>
              <p class="rd-help" data-i18n="de.slaHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="de-schedule" data-i18n="de.schedule"></label>
              <select id="de-schedule" class="rd-control">
                <option data-i18n="de.sysDefault"></option>
                <option selected>Hafta içi 09:00–18:00</option>
                <option>7/24</option>
              </select>
              <p class="rd-help" data-i18n="de.scheduleHelp"></p>
            </div>
          </div>
          <div class="rd-grid-2">
            <div class="rd-field mb-0">
              <label class="rd-label" for="de-manager" data-i18n="de.manager"></label>
              <select id="de-manager" class="rd-control">
                <option data-i18n="de.noManager"></option>
                <option selected>Ümit Y. Akın</option>
                <option>Merve Çetin</option>
                <option>Deniz Kaya</option>
              </select>
              <p class="rd-help" data-i18n="de.managerHelp"></p>
            </div>
            <div class="rd-field mb-0">
              <label class="rd-label" for="de-assign" data-i18n="de.assignMode"></label>
              <select id="de-assign" class="rd-control">
                <option data-i18n="de.amAll"></option>
                <option selected data-i18n="de.amMembers"></option>
                <option data-i18n="de.amPrimary"></option>
              </select>
              <p class="rd-help" data-i18n="de.assignModeHelp"></p>
            </div>
          </div>
          <details class="rd-advanced">
            <summary data-i18n="common.advanced"></summary>
            <div class="rd-advanced-body">
              <div class="rd-field">
                <label class="rd-switch">
                  <input type="checkbox">
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="de.disableClaim"></b>
                    <small data-i18n="de.disableClaimHelp"></small>
                  </span>
                </label>
              </div>
              <div class="rd-field mb-0">
                <label class="rd-switch">
                  <input type="checkbox">
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="de.disableReopenAssign"></b>
                    <small data-i18n="de.disableReopenAssignHelp"></small>
                  </span>
                </label>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div class="rd-surface" style="margin-bottom:18px">
        <div class="rd-surface-head" data-i18n="de.secEmail"></div>
        <div class="rd-surface-body">
          <div class="rd-grid-2">
            <div class="rd-field mb-0">
              <label class="rd-label" for="de-email" data-i18n="de.outEmail"></label>
              <select id="de-email" class="rd-control">
                <option data-i18n="de.sysDefault"></option>
                <option selected>bordro@rapidsol.com.tr</option>
                <option>destek@rapidsol.com.tr</option>
                <option>bilgi@rapidsol.com.tr</option>
              </select>
              <p class="rd-help" data-i18n="de.outEmailHelp"></p>
            </div>
            <div class="rd-field mb-0">
              <label class="rd-label" for="de-template" data-i18n="de.templateSet"></label>
              <select id="de-template" class="rd-control">
                <option data-i18n="de.sysDefault"></option>
                <option selected>Varsayılan (TR)</option>
                <option>English Set (EN)</option>
              </select>
              <p class="rd-help" data-i18n="de.templateSetHelp"></p>
            </div>
          </div>
        </div>
      </div>

      <div class="rd-surface" style="margin-bottom:18px">
        <div class="rd-surface-head" data-i18n="de.secAutoresp"></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox">
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="de.arNewTicket"></b>
                <small data-i18n="de.arNewTicketHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="de.arNewMessage"></b>
                <small data-i18n="de.arNewMessageHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field mb-0" style="max-width:380px">
            <label class="rd-label" for="de-ar-email" data-i18n="de.arEmail"></label>
            <select id="de-ar-email" class="rd-control">
              <option data-i18n="de.sysDefault"></option>
              <option selected>bordro@rapidsol.com.tr</option>
              <option>destek@rapidsol.com.tr</option>
            </select>
            <p class="rd-help" data-i18n="de.arEmailHelp"></p>
          </div>
        </div>
      </div>

      <div class="rd-surface" style="margin-bottom:18px">
        <div class="rd-surface-head" data-i18n="de.secAlerts"></div>
        <div class="rd-surface-body">
          <div class="rd-field mb-0" style="max-width:380px">
            <label class="rd-label" for="de-alert-group" data-i18n="de.alertGroup"></label>
            <select id="de-alert-group" class="rd-control">
              <option selected data-i18n="de.agAll"></option>
              <option data-i18n="de.agManager"></option>
              <option data-i18n="de.agMembersPrimary"></option>
            </select>
            <p class="rd-help" data-i18n="de.alertGroupHelp"></p>
          </div>
        </div>
      </div>

      <div class="rd-surface">
        <div class="rd-surface-head" data-i18n="de.secSignature"></div>
        <div class="rd-surface-body">
          <div class="rd-field mb-0">
            <textarea class="rd-control" style="min-height:90px">RapidSol Bordro Ekibi
bordro@rapidsol.com.tr · 0212 555 24 80</textarea>
            <p class="rd-help" data-i18n="de.signatureHelp"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ Erişim ============ -->
    <div class="rd-tab-panel" id="panel-access" data-tab-group="main">
      <div class="rd-surface">
        <div class="rd-surface-head">
          <span data-i18n="de.secMembers"></span>
          <small class="rd-muted" data-i18n="de.membersHelp"></small>
          <span class="spacer"></span>
          <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-i18n="common.export"></button>
        </div>
        <table class="rd-table">
          <thead>
            <tr>
              <th data-i18n="de.colAgent"></th>
              <th data-i18n="de.colRole"></th>
              <th data-i18n="de.colAlerts"></th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <span style="display:inline-flex;align-items:center;gap:10px">
                  <span class="rd-avatar">ÜA</span> Ümit Y. Akın
                  <span class="rd-badge-inherited" data-i18n="de.primaryBadge"></span>
                </span>
              </td>
              <td>
                <select class="rd-control" style="max-width:200px">
                  <option selected>Yönetici</option>
                  <option>Kıdemli Temsilci</option>
                  <option>Temsilci</option>
                  <option>Salt Okunur</option>
                </select>
              </td>
              <td><label class="rd-check"><input type="checkbox" checked><span data-i18n="de.colAlerts"></span></label></td>
              <td><button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-i18n-title="common.delete">✕</button></td>
            </tr>
            <tr>
              <td>
                <span style="display:inline-flex;align-items:center;gap:10px">
                  <span class="rd-avatar">DK</span> Deniz Kaya
                </span>
              </td>
              <td>
                <select class="rd-control" style="max-width:200px">
                  <option>Yönetici</option>
                  <option>Kıdemli Temsilci</option>
                  <option selected>Temsilci</option>
                  <option>Salt Okunur</option>
                </select>
              </td>
              <td><label class="rd-check"><input type="checkbox"><span data-i18n="de.colAlerts"></span></label></td>
              <td><button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-i18n-title="common.delete">✕</button></td>
            </tr>
          </tbody>
        </table>
        <div class="rd-surface-body" style="border-top:1px solid var(--rd-border-soft)">
          <div style="display:flex;gap:9px;max-width:380px">
            <select class="rd-control">
              <option selected data-i18n="de.addAgentPh"></option>
              <option>Merve Çetin</option>
              <option>Zeynep Arslan</option>
            </select>
            <button type="button" class="rd-btn" data-i18n="common.add"></button>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="rd-btn-primary" data-i18n="common.save"></button>
      <a class="rd-btn" href="departments.html" data-i18n="common.cancel"></a>
    </div>
  </form>

</main>
</body>
</html>
