<body class="backoffice" data-panel="admin" data-nav="email-settings">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">

  <div class="bo-page-head">
    <div>
      <h1 data-i18n="es.title"></h1>
      <p data-i18n="es.subtitle"></p>
    </div>
  </div>

  <form>
    <div class="bo-settings">
      <nav class="bo-section-index">
        <a href="#section-general" class="active" data-i18n="es.idxGeneral"></a>
        <a href="#section-incoming" data-i18n="es.idxIncoming"></a>
        <a href="#section-outgoing" data-i18n="es.idxOutgoing"></a>
      </nav>

      <div class="bo-settings-sections">

        <!-- ==== Genel ==== -->
        <section class="rd-surface bo-section" id="section-general">
          <div class="rd-surface-head" data-i18n="es.secGeneral"></div>
          <div class="rd-surface-body">
            <div class="rd-field">
              <label class="rd-label" for="es-template" data-i18n="es.defaultTemplate"></label>
              <select id="es-template" class="rd-control">
                <option selected>Varsayılan (TR)</option>
                <option>English Set (EN)</option>
              </select>
              <p class="rd-help" data-i18n="es.defaultTemplateHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="es-sysemail" data-i18n="es.defaultEmail"></label>
              <select id="es-sysemail" class="rd-control">
                <option selected>destek@rapidsol.com.tr</option>
                <option>bordro@rapidsol.com.tr</option>
                <option>bilgi@rapidsol.com.tr</option>
              </select>
              <p class="rd-help" data-i18n="es.defaultEmailHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="es-alertemail" data-i18n="es.alertEmail"></label>
              <select id="es-alertemail" class="rd-control">
                <option>destek@rapidsol.com.tr</option>
                <option selected>bilgi@rapidsol.com.tr</option>
                <option>bordro@rapidsol.com.tr</option>
              </select>
              <p class="rd-help" data-i18n="es.alertEmailHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="es-adminemail" data-i18n="es.adminEmail"></label>
              <input id="es-adminemail" class="rd-control" type="email" value="umit.akin@rapidsol.com.tr">
              <p class="rd-help" data-i18n="es.adminEmailHelp"></p>
            </div>
            <details class="rd-advanced">
              <summary data-i18n="common.advanced"></summary>
              <div class="rd-advanced-body">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="es.verifyDomain"></b>
                    <small data-i18n="es.verifyDomainHelp"></small>
                  </span>
                </label>
              </div>
            </details>
          </div>
        </section>

        <!-- ==== Gelen ==== -->
        <section class="rd-surface bo-section" id="section-incoming">
          <div class="rd-surface-head" data-i18n="es.secIncoming"></div>
          <div class="rd-surface-body">
            <div class="rd-field">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.polling"></b>
                  <small data-i18n="es.pollingHelp"></small>
                </span>
              </label>
            </div>
            <div class="rd-field">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.cron"></b>
                  <small data-i18n="es.cronHelp"></small>
                </span>
              </label>
            </div>
            <div class="rd-field">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.stripQuoted"></b>
                  <small data-i18n="es.stripQuotedHelp"></small>
                </span>
              </label>
            </div>
            <div class="rd-field">
              <label class="rd-label" for="es-separator" data-i18n="es.separator"></label>
              <input id="es-separator" class="rd-control" type="text" value="-- lütfen bu satırın üstüne yazın --" style="max-width:360px">
              <p class="rd-help" data-i18n="es.separatorHelp"></p>
            </div>
            <div class="rd-field">
              <label class="rd-switch">
                <input type="checkbox">
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.emailPriority"></b>
                  <small data-i18n="es.emailPriorityHelp"></small>
                </span>
              </label>
            </div>
            <div class="rd-field">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.acceptUnregistered"></b>
                  <small data-i18n="es.acceptUnregisteredHelp"></small>
                </span>
              </label>
            </div>
            <div class="rd-field mb-0">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.autoCollabs"></b>
                  <small data-i18n="es.autoCollabsHelp"></small>
                </span>
              </label>
            </div>
          </div>
        </section>

        <!-- ==== Giden ==== -->
        <section class="rd-surface bo-section" id="section-outgoing">
          <div class="rd-surface-head" data-i18n="es.secOutgoing"></div>
          <div class="rd-surface-body">
            <div class="rd-field">
              <label class="rd-label" for="es-smtp" data-i18n="es.defaultSmtp"></label>
              <select id="es-smtp" class="rd-control">
                <option data-i18n="es.optPhpMail"></option>
                <option selected>destek@rapidsol.com.tr — SMTP</option>
              </select>
              <p class="rd-help" data-i18n="es.defaultSmtpHelp"></p>
            </div>
            <div class="rd-field mb-0">
              <label class="rd-switch">
                <input type="checkbox" checked>
                <span class="track"></span>
                <span class="rd-switch-copy">
                  <b data-i18n="es.attachments"></b>
                  <small data-i18n="es.attachmentsHelp"></small>
                </span>
              </label>
            </div>
          </div>
        </section>

        <div style="display:flex;gap:10px">
          <button class="rd-btn-primary" data-i18n="common.save"></button>
          <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
        </div>

      </div>
    </div>
  </form>

</main>
</body>
</html>
