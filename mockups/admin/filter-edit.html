<body class="backoffice" data-panel="admin" data-nav="filters">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">
<form>

  <div class="bo-page-head">
    <div>
      <a href="filters.html" style="font-size:13px" data-i18n="fle.back"></a>
      <h1>VIP kullanıcı önceliklendirme</h1>
      <p data-i18n="fle.sub"></p>
    </div>
    <div class="actions">
      <button type="button" class="rd-btn rd-btn-danger" data-dialog-open="dlg-delete" data-i18n="common.delete"></button>
      <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
      <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
    </div>
  </div>

  <div class="rd-surface" style="margin-bottom:20px">
    <div class="rd-surface-body">
      <div class="rd-grid-2">
        <div class="rd-field">
          <label class="rd-label" for="fle-name" data-i18n="fle.name"></label>
          <input id="fle-name" class="rd-control" value="VIP kullanıcı önceliklendirme">
          <div class="rd-help" data-i18n="fle.nameHelp"></div>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="fle-order" data-i18n="fle.order"></label>
          <input id="fle-order" class="rd-control" type="number" value="1" min="1" style="max-width:120px">
          <div class="rd-help" data-i18n="fle.orderHelp"></div>
        </div>
        <div class="rd-field">
          <span class="rd-label" data-i18n="fle.status"></span>
          <div style="display:flex;gap:18px;padding:10px 0 2px">
            <label class="rd-check"><input type="radio" name="fle-status" checked><span data-i18n="common.active"></span></label>
            <label class="rd-check"><input type="radio" name="fle-status"><span data-i18n="common.disabled"></span></label>
          </div>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="fle-target" data-i18n="fle.target"></label>
          <select id="fle-target" class="rd-control">
            <option data-i18n="fle.targetAny"></option>
            <option data-i18n="fle.targetWeb"></option>
            <option data-i18n="fle.targetApi"></option>
            <option selected data-i18n="fle.targetEmailAny"></option>
            <optgroup data-i18n-label="fle.grpSysEmails" label="Sistem E-postaları">
              <option>destek@rapidsol.com.tr</option>
              <option>bordro@rapidsol.com.tr</option>
            </optgroup>
          </select>
          <div class="rd-help" data-i18n="fle.targetHelp"></div>
        </div>
      </div>
      <label class="rd-switch">
        <input type="checkbox" checked>
        <span class="track"></span>
        <span class="rd-switch-copy"><b data-i18n="fle.stopOnMatch"></b><small data-i18n="fle.stopOnMatchHelp"></small></span>
      </label>
    </div>
  </div>

  <div class="rd-tabs" data-tabs>
    <button type="button" class="active" data-tab="fle-rules" data-i18n="fle.tabRules"></button>
    <button type="button" data-tab="fle-actions" data-i18n="fle.tabActions"></button>
    <button type="button" data-tab="fle-notes" data-i18n="fle.tabNotes"></button>
  </div>

  <!-- ============ Kurallar ============ -->
  <div class="rd-tab-panel active" id="fle-rules">
    <div class="rd-surface">
      <div class="rd-surface-body">
        <div class="rd-field">
          <span class="rd-label" data-i18n="fle.matchLabel"></span>
          <div style="display:flex;gap:18px;padding:6px 0 2px;flex-wrap:wrap">
            <label class="rd-check"><input type="radio" name="fle-match" checked><span data-i18n="fle.matchAll"></span></label>
            <label class="rd-check"><input type="radio" name="fle-match"><span data-i18n="fle.matchAny"></span></label>
          </div>
          <div class="rd-help" data-i18n="fle.rulesHelp"></div>
        </div>

        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.fName"></option>
            <option data-i18n="fle.fEmail"></option>
            <option data-i18n="fle.fReplyTo"></option>
            <option data-i18n="fle.fSubject"></option>
            <option data-i18n="fle.fTopic"></option>
            <option selected data-i18n="fle.fOrg"></option>
          </select>
          <select class="rd-control">
            <option selected data-i18n="fle.opEq"></option>
            <option data-i18n="fle.opContains"></option>
            <option data-i18n="fle.opStarts"></option>
            <option data-i18n="fle.opRegex"></option>
          </select>
          <input class="rd-control" value="Tosyalı Holding" data-i18n-placeholder="fle.valuePh">
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>
        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.fName"></option>
            <option selected data-i18n="fle.fEmail"></option>
            <option data-i18n="fle.fReplyTo"></option>
            <option data-i18n="fle.fSubject"></option>
            <option data-i18n="fle.fTopic"></option>
            <option data-i18n="fle.fOrg"></option>
          </select>
          <select class="rd-control">
            <option data-i18n="fle.opEq"></option>
            <option selected data-i18n="fle.opContains"></option>
            <option data-i18n="fle.opStarts"></option>
            <option data-i18n="fle.opRegex"></option>
          </select>
          <input class="rd-control" value="@tosyali.com" data-i18n-placeholder="fle.valuePh">
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>
        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.fName"></option>
            <option data-i18n="fle.fEmail"></option>
            <option data-i18n="fle.fReplyTo"></option>
            <option selected data-i18n="fle.fSubject"></option>
            <option data-i18n="fle.fTopic"></option>
            <option data-i18n="fle.fOrg"></option>
          </select>
          <select class="rd-control">
            <option data-i18n="fle.opEq"></option>
            <option selected data-i18n="fle.opContains"></option>
            <option data-i18n="fle.opStarts"></option>
            <option data-i18n="fle.opRegex"></option>
          </select>
          <input class="rd-control" value="acil" data-i18n-placeholder="fle.valuePh">
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>

        <button type="button" class="rd-btn rd-btn-ghost" data-i18n="fle.addRule"></button>
      </div>
    </div>
  </div>

  <!-- ============ Eylemler ============ -->
  <div class="rd-tab-panel" id="fle-actions">
    <div class="rd-surface">
      <div class="rd-surface-body">
        <p class="rd-help" style="margin:0 0 14px" data-i18n="fle.actionsHelp"></p>

        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.aReject"></option>
            <option data-i18n="fle.aDept"></option>
            <option selected data-i18n="fle.aPriority"></option>
            <option data-i18n="fle.aSla"></option>
            <option data-i18n="fle.aTeam"></option>
            <option data-i18n="fle.aAgent"></option>
            <option data-i18n="fle.aTopic"></option>
            <option data-i18n="fle.aStatus"></option>
            <option data-i18n="fle.aNoAutoresp"></option>
            <option data-i18n="fle.aCanned"></option>
            <option data-i18n="fle.aEmail"></option>
          </select>
          <select class="rd-control">
            <option data-i18n="priority.low"></option>
            <option data-i18n="priority.normal"></option>
            <option selected data-i18n="priority.high"></option>
            <option data-i18n="priority.emergency"></option>
          </select>
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>
        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.aReject"></option>
            <option selected data-i18n="fle.aDept"></option>
            <option data-i18n="fle.aPriority"></option>
            <option data-i18n="fle.aSla"></option>
            <option data-i18n="fle.aTeam"></option>
            <option data-i18n="fle.aAgent"></option>
            <option data-i18n="fle.aTopic"></option>
            <option data-i18n="fle.aStatus"></option>
            <option data-i18n="fle.aNoAutoresp"></option>
            <option data-i18n="fle.aCanned"></option>
            <option data-i18n="fle.aEmail"></option>
          </select>
          <select class="rd-control">
            <option selected>Bordro Yönetimi</option>
            <option>İnsan Kaynakları</option>
            <option>Danışmanlık</option>
            <option>Destek</option>
          </select>
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>
        <div class="bo-rule-row">
          <select class="rd-control">
            <option data-i18n="fle.aReject"></option>
            <option data-i18n="fle.aDept"></option>
            <option data-i18n="fle.aPriority"></option>
            <option selected data-i18n="fle.aSla"></option>
            <option data-i18n="fle.aTeam"></option>
            <option data-i18n="fle.aAgent"></option>
            <option data-i18n="fle.aTopic"></option>
            <option data-i18n="fle.aStatus"></option>
            <option data-i18n="fle.aNoAutoresp"></option>
            <option data-i18n="fle.aCanned"></option>
            <option data-i18n="fle.aEmail"></option>
          </select>
          <select class="rd-control">
            <option>Standart</option>
            <option selected>VIP</option>
            <option>Kritik</option>
          </select>
          <button type="button" class="remove" data-i18n-title="common.delete">✕</button>
        </div>

        <div class="bo-rule-row" style="margin-top:14px">
          <select class="rd-control" style="max-width:260px">
            <option data-i18n="fle.aReject"></option>
            <option data-i18n="fle.aDept"></option>
            <option data-i18n="fle.aPriority"></option>
            <option data-i18n="fle.aSla"></option>
            <option data-i18n="fle.aTeam"></option>
            <option data-i18n="fle.aAgent"></option>
            <option data-i18n="fle.aTopic"></option>
            <option data-i18n="fle.aStatus"></option>
            <option data-i18n="fle.aNoAutoresp"></option>
            <option data-i18n="fle.aCanned"></option>
            <option data-i18n="fle.aEmail"></option>
          </select>
          <button type="button" class="rd-btn rd-btn-ghost" data-i18n="fle.addAction"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ İç Notlar ============ -->
  <div class="rd-tab-panel" id="fle-notes">
    <div class="rd-surface">
      <div class="rd-surface-body" style="max-width:720px">
        <div class="rd-field mb-0">
          <label class="rd-label" for="fle-notes-ta" data-i18n="common.notes"></label>
          <textarea id="fle-notes-ta" class="rd-control">Tosyalı Holding sözleşmesi gereği 8 saatlik VIP SLA uygulanır.</textarea>
          <div class="rd-help" data-i18n="common.notesHelp"></div>
        </div>
      </div>
    </div>
  </div>

</form>

  <dialog class="rd-dialog" id="dlg-delete">
    <div class="rd-dialog-head"><span data-i18n="common.delete"></span><button class="close" data-dialog-close>✕</button></div>
    <div class="rd-dialog-body"><p data-i18n="common.confirmDelete"></p></div>
    <div class="rd-dialog-foot">
      <button class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
      <button class="rd-btn rd-btn-danger" data-dialog-close data-i18n="common.delete"></button>
    </div>
  </dialog>

</main>
</body>
</html>
