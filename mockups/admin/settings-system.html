<body class="backoffice" data-panel="admin" data-nav="settings-system">
<div id="rd-topbar"></div>

<main class="bo-main">
  <div class="bo-page-head">
    <div>
      <h1 data-i18n="ss.title"></h1>
      <p data-i18n="ss.subtitle"></p>
    </div>
  </div>

  <div class="bo-settings">
    <nav class="bo-section-index" aria-label="Sections">
      <a href="#sec-general" class="active" data-i18n="ss.secGeneral"></a>
      <a href="#sec-datetime" data-i18n="ss.secDatetime"></a>
      <a href="#sec-lang" data-i18n="ss.secLang"></a>
      <a href="#sec-attach" data-i18n="ss.secAttach"></a>
    </nav>

    <form class="bo-settings-sections">

      <section class="rd-surface bo-section" id="sec-general">
        <div class="rd-surface-head"><span data-i18n="ss.secGeneral"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="ss.online"></b>
                <small data-i18n="ss.onlineHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="sys-url" data-i18n="ss.url"></label>
            <input id="sys-url" class="rd-control" type="url" value="https://destek.rapidsol.com.tr/">
            <div class="rd-help" data-i18n="ss.urlHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="sys-name" data-i18n="ss.name"></label>
            <input id="sys-name" class="rd-control" value="RapidsolDestek">
            <div class="rd-help" data-i18n="ss.nameHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="sys-dept" data-i18n="ss.defaultDept"></label>
            <select id="sys-dept" class="rd-control">
              <option selected>Destek</option>
              <option>Bordro</option>
              <option>İK Danışmanlık</option>
            </select>
            <div class="rd-help" data-i18n="ss.defaultDeptHelp"></div>
          </div>

          <details class="rd-advanced">
            <summary data-i18n="common.advanced"></summary>
            <div class="rd-advanced-body">
              <div class="rd-field">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="ss.forceHttps"></b>
                    <small data-i18n="ss.forceHttpsHelp"></small>
                  </span>
                </label>
              </div>
              <div class="rd-grid-2">
                <div class="rd-field">
                  <label class="rd-label" for="sys-collision" data-i18n="ss.collision"></label>
                  <input id="sys-collision" class="rd-control" type="number" min="1" value="3">
                  <div class="rd-help" data-i18n="ss.collisionHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="sys-pagesize" data-i18n="ss.pageSize"></label>
                  <select id="sys-pagesize" class="rd-control">
                    <option>10</option>
                    <option selected>25</option>
                    <option>50</option>
                    <option>100</option>
                  </select>
                  <div class="rd-help" data-i18n="ss.pageSizeHelp"></div>
                </div>
              </div>
              <div class="rd-grid-2">
                <div class="rd-field">
                  <label class="rd-label" for="sys-loglevel" data-i18n="ss.logLevel"></label>
                  <select id="sys-loglevel" class="rd-control">
                    <option data-i18n="ss.logNone"></option>
                    <option data-i18n="ss.logError"></option>
                    <option selected data-i18n="ss.logWarn"></option>
                    <option data-i18n="ss.logDebug"></option>
                  </select>
                  <div class="rd-help" data-i18n="ss.logLevelHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="sys-logpurge" data-i18n="ss.logPurge"></label>
                  <select id="sys-logpurge" class="rd-control">
                    <option data-i18n="ss.purgeNever"></option>
                    <option data-i18n="ss.purge1m"></option>
                    <option selected data-i18n="ss.purge3m"></option>
                    <option data-i18n="ss.purge6m"></option>
                    <option data-i18n="ss.purge12m"></option>
                  </select>
                  <div class="rd-help" data-i18n="ss.logPurgeHelp"></div>
                </div>
              </div>
              <div class="rd-field">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="ss.avatars"></b>
                    <small data-i18n="ss.avatarsHelp"></small>
                  </span>
                </label>
              </div>
              <div class="rd-field">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="ss.richtext"></b>
                    <small data-i18n="ss.richtextHelp"></small>
                  </span>
                </label>
              </div>
              <div class="rd-field">
                <label class="rd-label" for="sys-iframe" data-i18n="ss.iframeList"></label>
                <input id="sys-iframe" class="rd-control" placeholder="https://intranet.rapidsol.com.tr">
                <div class="rd-help" data-i18n="ss.iframeListHelp"></div>
              </div>
              <div class="rd-field">
                <label class="rd-label" for="sys-embed" data-i18n="ss.embedList"></label>
                <input id="sys-embed" class="rd-control" placeholder="youtube.com, vimeo.com">
                <div class="rd-help" data-i18n="ss.embedListHelp"></div>
              </div>
              <div class="rd-field">
                <label class="rd-label" for="sys-acl" data-i18n="ss.acl"></label>
                <input id="sys-acl" class="rd-control" placeholder="10.0.4.0/24, 88.243.17.90">
                <div class="rd-help" data-i18n="ss.aclHelp"></div>
              </div>
              <div class="rd-field mb-0">
                <label class="rd-label" for="sys-acl-backend" data-i18n="ss.aclBackend"></label>
                <select id="sys-acl-backend" class="rd-control">
                  <option selected data-i18n="ss.aclAdmin"></option>
                  <option data-i18n="ss.aclStaff"></option>
                  <option data-i18n="ss.aclAll"></option>
                </select>
                <div class="rd-help" data-i18n="ss.aclBackendHelp"></div>
              </div>
            </div>
          </details>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-datetime">
        <div class="rd-surface-head"><span data-i18n="ss.secDatetime"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="dt-locale" data-i18n="ss.locale"></label>
            <select id="dt-locale" class="rd-control">
              <option selected>Türkçe (Türkiye)</option>

              <option>English (United Kingdom)</option>

            <div class="rd-help" data-i18n="ss.localeHelp"></div>

          <div class="rd-field">

              <option>UTC (+00:00)</option>
              <option>Europe/Berlin (+02:00)</option>

            <div class="rd-help" data-i18n="ss.timezoneHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="dt-mode" data-i18n="ss.timeFormatMode"></label>
            <select id="dt-mode" class="rd-control">
              <option selected data-i18n="ss.fmtLocale"></option>
              <option data-i18n="ss.fmt24"></option>
              <option data-i18n="ss.fmtAdvanced"></option>
            </select>
            <div class="rd-help" data-i18n="ss.timeFormatModeHelp"></div>
          </div>

          <details class="rd-advanced">
            <summary data-i18n="common.advanced"></summary>
            <div class="rd-advanced-body">
              <div class="rd-grid-2">
                <div class="rd-field">
                  <label class="rd-label" for="dt-time" data-i18n="ss.timeFormat"></label>
                  <input id="dt-time" class="rd-control" value="HH:mm">
                  <div class="rd-help" data-i18n="ss.timeFormatHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="dt-date" data-i18n="ss.dateFormat"></label>
                  <input id="dt-date" class="rd-control" value="d MMMM y">
                  <div class="rd-help" data-i18n="ss.dateFormatHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="dt-datetime" data-i18n="ss.datetimeFormat"></label>
                  <input id="dt-datetime" class="rd-control" value="d MMM y HH:mm">
                  <div class="rd-help" data-i18n="ss.datetimeFormatHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="dt-day" data-i18n="ss.dayFormat"></label>
                  <input id="dt-day" class="rd-control" value="EEEE, d MMMM">
                  <div class="rd-help" data-i18n="ss.dayFormatHelp"></div>
                </div>
              </div>
              <div class="rd-field mb-0">
                <label class="rd-label" for="dt-schedule" data-i18n="ss.defaultSchedule"></label>
                <select id="dt-schedule" class="rd-control">
                  <option>7/24</option>
                  <option selected>Mesai Saatleri (09:00–18:00)</option>
                </select>
                <div class="rd-help" data-i18n="ss.defaultScheduleHelp"></div>
                <a class="rd-btn rd-btn-ghost rd-btn-sm" style="margin-top:7px" href="schedules.html" data-i18n="ss.manageSchedules"></a>
              </div>
            </div>
          </details>
        </div>
      </section>

        <div class="rd-surface-body">

              </div>
            </div>
            <div class="bo-rule-row" style="margin-bottom:0">

                <option>Deutsch</option>

            </select>
            <div class="rd-help" data-i18n="ss.maxSizeHelp"></div>
          </div>
          <div class="rd-field mb-0">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="ss.authRequired"></b>
                <small data-i18n="ss.authRequiredHelp"></small>
              </span>
            </label>
          </div>
        </div>
      </section>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
        <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
