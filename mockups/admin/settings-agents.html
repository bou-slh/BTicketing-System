<body class="backoffice" data-panel="admin" data-nav="settings-agents">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>

<main class="bo-main">
  <div class="bo-page-head">
    <div>
      <h1 data-i18n="sa.title"></h1>
      <p data-i18n="sa.subtitle"></p>
    </div>
  </div>

  <div class="bo-settings">
    <nav class="bo-section-index" aria-label="Sections">
      <a href="#sec-general" class="active" data-i18n="sa.secGeneral"></a>
      <a href="#sec-auth" data-i18n="sa.secAuth"></a>
      <a href="#sec-templates" data-i18n="sa.secTemplates"></a>
    </nav>

    <form class="bo-settings-sections">

      <section class="rd-surface bo-section" id="sec-general">
        <div class="rd-surface-head"><span data-i18n="sa.secGeneral"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="ag-nameformat" data-i18n="sa.nameFormat"></label>
            <select id="ag-nameformat" class="rd-control" style="max-width:340px">
              <option selected data-i18n="sa.nfFull"></option>
              <option data-i18n="sa.nfLastFirst"></option>
              <option data-i18n="sa.nfShort"></option>
              <option data-i18n="sa.nfUsername"></option>
            </select>
            <div class="rd-help" data-i18n="sa.nameFormatHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox">
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="sa.masking"></b>
                <small data-i18n="sa.maskingHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="ag-avatar" data-i18n="sa.avatarSource"></label>
            <select id="ag-avatar" class="rd-control" style="max-width:340px">
              <option selected data-i18n="sa.avInitials"></option>
              <option data-i18n="sa.avGravatar"></option>
            </select>
            <div class="rd-help" data-i18n="sa.avatarSourceHelp"></div>
          </div>
          <div class="rd-field mb-0">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="sa.blockCollab"></b>
                <small data-i18n="sa.blockCollabHelp"></small>
              </span>
            </label>
          </div>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-auth">
        <div class="rd-surface-head"><span data-i18n="sa.secAuth"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="ag-pwpolicy" data-i18n="sa.pwPolicy"></label>
            <select id="ag-pwpolicy" class="rd-control" style="max-width:340px">
              <option data-i18n="sa.pwNone"></option>
              <option data-i18n="sa.pwBasic"></option>
              <option selected data-i18n="sa.pwStrong"></option>
            </select>
            <div class="rd-help" data-i18n="sa.pwPolicyHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="sa.pwReset"></b>
                <small data-i18n="sa.pwResetHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="ag-resetwindow" data-i18n="sa.resetWindow"></label>
            <input id="ag-resetwindow" class="rd-control" type="number" min="5" value="30" style="max-width:220px">
            <div class="rd-help" data-i18n="sa.resetWindowHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="sa.twofa"></b>
                <small data-i18n="sa.twofaHelp"></small>
              </span>
            </label>
          </div>

          <details class="rd-advanced">
            <summary data-i18n="common.advanced"></summary>
            <div class="rd-advanced-body">
              <div class="rd-grid-2">
                <div class="rd-field">
                  <label class="rd-label" for="ag-maxattempts" data-i18n="sa.maxAttempts"></label>
                  <select id="ag-maxattempts" class="rd-control">
                    <option>3</option>
                    <option selected>5</option>
                    <option>10</option>
                  </select>
                  <div class="rd-help" data-i18n="sa.maxAttemptsHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="ag-lockduration" data-i18n="sa.lockDuration"></label>
                  <select id="ag-lockduration" class="rd-control">
                    <option data-i18n="sa.min15"></option>
                    <option selected data-i18n="sa.min30"></option>
                    <option data-i18n="sa.hour1"></option>
                  </select>
                  <div class="rd-help" data-i18n="sa.lockDurationHelp"></div>
                </div>
              </div>
              <div class="rd-field">
                <label class="rd-label" for="ag-session" data-i18n="sa.sessionTimeout"></label>
                <input id="ag-session" class="rd-control" type="number" min="0" value="120" style="max-width:220px">
                <div class="rd-help" data-i18n="sa.sessionTimeoutHelp"></div>
              </div>
              <div class="rd-field mb-0">
                <label class="rd-switch">
                  <input type="checkbox">
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="sa.ipBinding"></b>
                    <small data-i18n="sa.ipBindingHelp"></small>
                  </span>
                </label>
              </div>
            </div>
          </details>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-templates">
        <div class="rd-surface-head"><span data-i18n="sa.secTemplates"></span></div>
        <div class="rd-surface-body">
          <p class="rd-help" style="margin:0 0 12px" data-i18n="sa.tplHelp"></p>
          <div class="bo-def">
            <div class="row">
              <span data-i18n="sa.tplWelcome"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="sa.tplWelcomeHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="sa.tplBanner"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="sa.tplBannerHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="sa.tplPwreset"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="sa.tplPwresetHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="sa.tpl2fa"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="sa.tpl2faHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
          </div>
        </div>
      </section>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
        <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
      </div>
    </form>
  </div>
</main>

<dialog class="rd-dialog" id="dlg-tpl">
  <div class="rd-dialog-head">
    <span data-i18n="sa.dlgTitle"></span>
    <button class="close" data-dialog-close aria-label="Close">✕</button>
  </div>
  <div class="rd-dialog-body">
    <div class="rd-field">
      <label class="rd-label" for="tpl-name" data-i18n="sa.dlgName"></label>
      <input id="tpl-name" class="rd-control" value="Hoş Geldin E-postası">
    </div>
    <div class="rd-field mb-0">
      <span class="rd-label" data-i18n="sa.dlgContent"></span>
      <div class="rd-tabs" data-tabs data-tabs-scope="tpl" style="margin-bottom:12px">
        <button type="button" class="active" data-tab="tpl-tr">Türkçe</button>
        <button type="button" data-tab="tpl-en">English</button>
      </div>
      <div class="rd-tab-panel active" id="tpl-tr" data-tab-group="tpl">
        <textarea class="rd-control">Merhaba %{staff.name},

RapidsolDestek temsilci hesabınız oluşturuldu. Giriş bilgilerinizi belirlemek için bağlantıya tıklayın: %{link}</textarea>
      </div>
      <div class="rd-tab-panel" id="tpl-en" data-tab-group="tpl">
        <textarea class="rd-control">Hello %{staff.name},

Your RapidsolDestek agent account has been created. Click the link to set your credentials: %{link}</textarea>
      </div>
      <div class="rd-help" data-i18n="sa.dlgContentHelp"></div>
    </div>
  </div>
  <div class="rd-dialog-foot">
    <button class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
    <button class="rd-btn rd-btn-primary" data-dialog-close data-i18n="common.save"></button>
  </div>
</dialog>
</body>
</html>
