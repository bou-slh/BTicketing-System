<body class="backoffice" data-panel="admin" data-nav="settings-users">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>

<main class="bo-main">
  <div class="bo-page-head">
    <div>
      <h1 data-i18n="su.title"></h1>
      <p data-i18n="su.subtitle"></p>
    </div>
  </div>

  <div class="bo-settings">
    <nav class="bo-section-index" aria-label="Sections">
      <a href="#sec-general" class="active" data-i18n="su.secGeneral"></a>
      <a href="#sec-auth" data-i18n="su.secAuth"></a>
      <a href="#sec-templates" data-i18n="su.secTemplates"></a>
    </nav>

    <form class="bo-settings-sections">

      <section class="rd-surface bo-section" id="sec-general">
        <div class="rd-surface-head"><span data-i18n="su.secGeneral"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="us-nameformat" data-i18n="su.nameFormat"></label>
            <select id="us-nameformat" class="rd-control" style="max-width:340px">
              <option selected data-i18n="su.nfFull"></option>
              <option data-i18n="su.nfLastFirst"></option>
              <option data-i18n="su.nfShort"></option>
            </select>
            <div class="rd-help" data-i18n="su.nameFormatHelp"></div>
          </div>
          <div class="rd-field mb-0">
            <label class="rd-label" for="us-avatar" data-i18n="su.avatarSource"></label>
            <select id="us-avatar" class="rd-control" style="max-width:340px">
              <option selected data-i18n="su.avInitials"></option>
              <option data-i18n="su.avGravatar"></option>
            </select>
            <div class="rd-help" data-i18n="su.avatarSourceHelp"></div>
          </div>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-auth">
        <div class="rd-surface-head"><span data-i18n="su.secAuth"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-switch">
              <input type="checkbox" checked>
              <span class="track"></span>
              <span class="rd-switch-copy">
                <b data-i18n="su.regRequired"></b>
                <small data-i18n="su.regRequiredHelp"></small>
              </span>
            </label>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="us-regmode" data-i18n="su.regMode"></label>
            <select id="us-regmode" class="rd-control">
              <option data-i18n="su.regClosed"></option>
              <option selected data-i18n="su.regPublic"></option>
              <option data-i18n="su.regPrivate"></option>
            </select>
            <div class="rd-help" data-i18n="su.regModeHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="us-pwpolicy" data-i18n="su.pwPolicy"></label>
            <select id="us-pwpolicy" class="rd-control" style="max-width:340px">
              <option data-i18n="su.pwNone"></option>
              <option selected data-i18n="su.pwBasic"></option>
              <option data-i18n="su.pwStrong"></option>
            </select>
            <div class="rd-help" data-i18n="su.pwPolicyHelp"></div>
          </div>

          <details class="rd-advanced">
            <summary data-i18n="common.advanced"></summary>
            <div class="rd-advanced-body">
              <div class="rd-grid-2">
                <div class="rd-field">
                  <label class="rd-label" for="us-maxattempts" data-i18n="su.maxAttempts"></label>
                  <select id="us-maxattempts" class="rd-control">
                    <option>3</option>
                    <option selected>5</option>
                    <option>10</option>
                  </select>
                  <div class="rd-help" data-i18n="su.maxAttemptsHelp"></div>
                </div>
                <div class="rd-field">
                  <label class="rd-label" for="us-lockduration" data-i18n="su.lockDuration"></label>
                  <select id="us-lockduration" class="rd-control">
                    <option data-i18n="su.min15"></option>
                    <option selected data-i18n="su.min30"></option>
                    <option data-i18n="su.hour1"></option>
                  </select>
                  <div class="rd-help" data-i18n="su.lockDurationHelp"></div>
                </div>
              </div>
              <div class="rd-field">
                <label class="rd-label" for="us-session" data-i18n="su.sessionTimeout"></label>
                <input id="us-session" class="rd-control" type="number" min="0" value="0" style="max-width:220px">
                <div class="rd-help" data-i18n="su.sessionTimeoutHelp"></div>
              </div>
              <div class="rd-field">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="su.authTokens"></b>
                    <small data-i18n="su.authTokensHelp"></small>
                  </span>
                </label>
              </div>
              <div class="rd-field mb-0">
                <label class="rd-switch">
                  <input type="checkbox" checked>
                  <span class="track"></span>
                  <span class="rd-switch-copy">
                    <b data-i18n="su.emailVerify"></b>
                    <small data-i18n="su.emailVerifyHelp"></small>
                  </span>
                </label>
              </div>
            </div>
          </details>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-templates">
        <div class="rd-surface-head"><span data-i18n="su.secTemplates"></span></div>
        <div class="rd-surface-body">
          <p class="rd-help" style="margin:0 0 12px" data-i18n="su.tplHelp"></p>
          <div class="bo-def">
            <div class="row">
              <span data-i18n="su.tplGuest"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplGuestHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="su.tplLogin"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplLoginHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="su.tplPwreset"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplPwresetHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="su.tplVerifyPage"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplVerifyPageHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="su.tplConfirmEmail"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplConfirmEmailHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
            <div class="row">
              <span data-i18n="su.tplConfirmedPage"></span>
              <span style="display:flex;align-items:center;gap:10px;justify-content:space-between">
                <span class="rd-help" style="margin:0" data-i18n="su.tplConfirmedPageHelp"></span>
                <button type="button" class="rd-btn rd-btn-ghost rd-btn-sm" data-dialog-open="dlg-tpl" data-i18n="common.edit"></button>
              </span>
            </div>
          </div>
        </div>
      </section>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
        <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
      </div>
    </form>
  </div>
</main>

<dialog class="rd-dialog" id="dlg-tpl">
  <div class="rd-dialog-head">
    <span data-i18n="su.dlgTitle"></span>
    <button class="close" data-dialog-close aria-label="Close">✕</button>
  </div>
  <div class="rd-dialog-body">
    <div class="rd-field">
      <label class="rd-label" for="tpl-name" data-i18n="su.dlgName"></label>
      <input id="tpl-name" class="rd-control" value="Misafir Erişim Bağlantısı">
    </div>
    <div class="rd-field mb-0">
      <span class="rd-label" data-i18n="su.dlgContent"></span>
      <div class="rd-tabs" data-tabs data-tabs-scope="tpl" style="margin-bottom:12px">
        <button type="button" class="active" data-tab="tpl-tr">Türkçe</button>
        <button type="button" data-tab="tpl-en">English</button>
      </div>
      <div class="rd-tab-panel active" id="tpl-tr" data-tab-group="tpl">
        <textarea class="rd-control">Merhaba %{user.name},

Talebinize erişmek için aşağıdaki bağlantıyı kullanabilirsiniz: %{link}</textarea>
      </div>
      <div class="rd-tab-panel" id="tpl-en" data-tab-group="tpl">
        <textarea class="rd-control">Hello %{user.name},

You can use the link below to access your request: %{link}</textarea>
      </div>
      <div class="rd-help" data-i18n="su.dlgContentHelp"></div>
    </div>
  </div>
  <div class="rd-dialog-foot">
    <button class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
    <button class="rd-btn rd-btn-primary" data-dialog-close data-i18n="common.save"></button>
  </div>
</dialog>
</body>
</html>
