<body class="backoffice" data-panel="admin" data-nav="settings-company">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>

<main class="bo-main">
  <div class="bo-page-head">
    <div>
      <h1 data-i18n="sc.title"></h1>
      <p data-i18n="sc.subtitle"></p>
    </div>
  </div>

  <div class="bo-settings">
    <nav class="bo-section-index" aria-label="Sections">
      <a href="#sec-basic" class="active" data-i18n="sc.secBasic"></a>
      <a href="#sec-pages" data-i18n="sc.secPages"></a>
      <a href="#sec-logos" data-i18n="sc.secLogos"></a>
      <a href="#sec-backdrop" data-i18n="sc.secBackdrop"></a>
    </nav>

    <form class="bo-settings-sections">

      <section class="rd-surface bo-section" id="sec-basic">
        <div class="rd-surface-head"><span data-i18n="sc.secBasic"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="co-name" data-i18n="sc.name"></label>
            <input id="co-name" class="rd-control" value="Rapidsol Bilişim ve Danışmanlık A.Ş.">
            <div class="rd-help" data-i18n="sc.nameHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="co-web" data-i18n="sc.website"></label>
            <input id="co-web" class="rd-control" type="url" value="https://www.rapidsol.com.tr">
            <div class="rd-help" data-i18n="sc.websiteHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="co-phone" data-i18n="sc.phone"></label>
            <input id="co-phone" class="rd-control" value="+90 212 555 24 24">
            <div class="rd-help" data-i18n="sc.phoneHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="co-address" data-i18n="sc.address"></label>
            <textarea id="co-address" class="rd-control">Maslak Mah. Büyükdere Cad. No:245 K:11
Sarıyer / İstanbul</textarea>
            <div class="rd-help" data-i18n="sc.addressHelp"></div>
          </div>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-pages">
        <div class="rd-surface-head">
          <span data-i18n="sc.secPages"></span>
          <span class="spacer"></span>
          <a class="rd-btn rd-btn-ghost rd-btn-sm" href="pages.html" data-i18n="sc.managePages"></a>
        </div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="co-landing" data-i18n="sc.landing"></label>
            <select id="co-landing" class="rd-control">
              <option selected>Karşılama — Hoş geldiniz (varsayılan)</option>
              <option>Karşılama — Bordro dönemi duyurusu</option>
            </select>
            <div class="rd-help" data-i18n="sc.landingHelp"></div>
          </div>
          <div class="rd-field">
            <label class="rd-label" for="co-offline" data-i18n="sc.offline"></label>
            <select id="co-offline" class="rd-control">
              <option selected>Çevrimdışı — Bakım bildirimi (varsayılan)</option>
              <option>Çevrimdışı — Hafta sonu mesajı</option>
            </select>
            <div class="rd-help" data-i18n="sc.offlineHelp"></div>
          </div>
          <div class="rd-field mb-0">
            <label class="rd-label" for="co-thanks" data-i18n="sc.thanks"></label>
            <select id="co-thanks" class="rd-control">
              <option selected>Teşekkürler — Talebiniz alındı (varsayılan)</option>
              <option>Teşekkürler — SLA bilgilendirmeli</option>
            </select>
            <div class="rd-help" data-i18n="sc.thanksHelp"></div>
          </div>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-logos">
        <div class="rd-surface-head"><span data-i18n="sc.secLogos"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <span class="rd-label" data-i18n="sc.clientLogo"></span>
            <div style="border:1px solid var(--rd-border);border-radius:11px;padding:18px;display:flex;align-items:center;gap:12px;margin-bottom:10px">
              <span class="rc-logo"><span class="rc-logo-mark"></span><span>RAPID<span class="rc-logo-accent">SOL</span></span></span>
              <span class="rd-pill rd-pill-teal" data-i18n="sc.current"></span>
            </div>
            <label class="rd-check" style="margin-bottom:7px">
              <input type="radio" name="client-logo" checked>
              <span data-i18n="sc.logoDefault"></span>
            </label>
            <label class="rd-check" style="margin-bottom:10px">
              <input type="radio" name="client-logo">
              <span data-i18n="sc.logoCustom"></span>
            </label>
            <div class="rd-upload" data-i18n="sc.upload"></div>
            <div class="rd-help" data-i18n="sc.clientLogoHelp"></div>
          </div>

          <div class="rd-field mb-0">
            <span class="rd-label" data-i18n="sc.staffLogo"></span>
            <div style="border:1px solid var(--rd-border);border-radius:11px;padding:18px;display:flex;align-items:center;gap:12px;margin-bottom:10px">
              <span class="rc-logo"><span class="rc-logo-mark"></span><span>RAPID<span class="rc-logo-accent">SOL</span></span></span>
              <span class="rd-pill rd-pill-teal" data-i18n="sc.current"></span>
            </div>
            <label class="rd-check" style="margin-bottom:7px">
              <input type="radio" name="staff-logo" checked>
              <span data-i18n="sc.logoDefault"></span>
            </label>
            <label class="rd-check" style="margin-bottom:10px">
              <input type="radio" name="staff-logo">
              <span data-i18n="sc.logoCustom"></span>
            </label>
            <div class="rd-upload" data-i18n="sc.upload"></div>
            <div class="rd-help" data-i18n="sc.staffLogoHelp"></div>
          </div>
        </div>
      </section>

      <section class="rd-surface bo-section" id="sec-backdrop">
        <div class="rd-surface-head"><span data-i18n="sc.secBackdrop"></span></div>
        <div class="rd-surface-body">
          <div class="rd-field mb-0">
            <span class="rd-label" data-i18n="sc.backdrop"></span>
            <div style="background:var(--rd-hero-gradient);border-radius:11px;height:120px;margin-bottom:10px"></div>
            <div class="rd-upload" data-i18n="sc.upload"></div>
            <div class="rd-help" data-i18n="sc.backdropHelp"></div>
          </div>
        </div>
      </section>

      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
        <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
