<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapidsolDestek — Listeler</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<script src="../assets/js/i18n-en.js"></script>
<script src="../assets/js/i18n-tr.js"></script>
<script>
window.PAGE_I18N = {
  tr: {
    "ls.title": "Listeler",
    "ls.sub": "Formlardaki seçim alanlarını besleyen özel değer listeleri.",
    "ls.searchPh": "Liste ara…",
    "ls.new": "＋ Yeni Liste",
    "ls.colName": "Liste Adı",
    "ls.colItems": "Öğe Sayısı",
    "ls.builtin": "Yerleşik",
    "ls.showing": "4 listeden 1–4 arası gösteriliyor",
    "ls.bulkTitle": "Toplu işlemler",
    "ls.bulkHelp": "Seçili listelere uygulanır. Yerleşik listeler silinemez.",
    "ls.emptyTitle": "Henüz özel liste yok",
    "ls.emptyText": "Seçim alanlarında kullanılacak ilk listenizi oluşturun.",
  },
  en: {
    "ls.title": "Lists",
    "ls.sub": "Custom value lists that feed choice fields on forms.",
    "ls.searchPh": "Search lists…",
    "ls.new": "＋ New List",
    "ls.colName": "List Name",
    "ls.colItems": "Item Count",
    "ls.builtin": "Built-in",
    "ls.showing": "Showing 1–4 of 4 lists",
    "ls.bulkTitle": "Bulk actions",
    "ls.bulkHelp": "Applied to the selected lists. Built-in lists cannot be deleted.",
    "ls.emptyTitle": "No custom lists yet",
    "ls.emptyText": "Create your first list to use in choice fields.",
  }
};
</script>
<script src="../assets/js/app.js" defer></script>
</head>
<body class="backoffice" data-panel="admin" data-nav="lists">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">

  <div class="bo-page-head">
    <div>
      <h1 data-i18n="ls.title"></h1>
      <p data-i18n="ls.sub"></p>
    </div>
  </div>

  <div class="rd-list-toolbar">
    <input type="search" class="rd-control" data-i18n-placeholder="ls.searchPh">
    <span class="spacer"></span>
    <button class="rd-btn" data-dialog-open="dlg-more"><span data-i18n="common.more"></span> ▾</button>
    <a class="rd-btn rd-btn-primary" href="list-edit.html" data-i18n="ls.new"></a>
  </div>

  <div class="rd-surface">
    <table class="rd-table" id="tbl-lists">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" data-check-all="#tbl-lists" data-i18n-title="common.selectAll"></th>
          <th class="sortable" data-i18n="ls.colName"></th>
          <th class="num" data-i18n="ls.colItems"></th>
          <th class="sortable" data-i18n="common.created"></th>
          <th class="sortable sorted-desc" data-i18n="common.updated"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-check"><input type="checkbox" disabled></td>
          <td><a href="list-edit.html">Talep Durumları</a> <span class="rd-pill rd-pill-teal" data-i18n="ls.builtin"></span></td>
          <td class="num">7</td>
          <td>3 Oca 2026</td>
          <td>12 Tem 2026</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox" disabled></td>
          <td><a href="list-edit.html">Öncelikler</a> <span class="rd-pill rd-pill-teal" data-i18n="ls.builtin"></span></td>
          <td class="num">4</td>
          <td>3 Oca 2026</td>
          <td>3 Oca 2026</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td><a href="list-edit.html">Sektörler</a></td>
          <td class="num">12</td>
          <td>15 Şub 2026</td>
          <td>2 Haz 2026</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td><a href="list-edit.html">Modüller</a></td>
          <td class="num">4</td>
          <td>15 Şub 2026</td>
          <td>4 Ağu 2026</td>
        </tr>
      </tbody>
    </table>
    <div class="rd-pagination">
      <span data-i18n="ls.showing"></span>
      <div class="pages"><span class="current">1</span></div>
    </div>
  </div>

  <!-- Empty-state variant (hidden) -->
  <div class="rd-tab-panel" id="ls-empty">
    <div class="rd-surface">
      <div class="rd-empty">
        <div class="icon">≔</div>
        <h3 data-i18n="ls.emptyTitle"></h3>
        <p data-i18n="ls.emptyText"></p>
        <a class="rd-btn rd-btn-primary" href="list-edit.html" data-i18n="ls.new"></a>
      </div>
    </div>
  </div>

  <dialog class="rd-dialog" id="dlg-more">
    <div class="rd-dialog-head"><span data-i18n="ls.bulkTitle"></span><button class="close" data-dialog-close>✕</button></div>
    <div class="rd-dialog-body">
      <p class="rd-help" style="margin-top:0" data-i18n="ls.bulkHelp"></p>
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:12px">
        <button class="rd-btn" data-dialog-close data-i18n="common.enable"></button>
        <button class="rd-btn" data-dialog-close data-i18n="common.disable"></button>
        <button class="rd-btn rd-btn-danger" data-dialog-open="dlg-delete" data-dialog-close data-i18n="common.delete"></button>
      </div>
    </div>
  </dialog>

  <dialog class="rd-dialog" id="dlg-delete">
    <div class="rd-dialog-head"><span data-i18n="common.delete"></span><button class="close" data-dialog-close>✕</button></div>
    <div class="rd-dialog-body"><p data-i18n="common.confirmDelete"></p></div>
    <div class="rd-dialog-foot">
      <button class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
      <button class="rd-btn rd-btn-danger" data-dialog-close data-i18n="common.delete"></button>
    </div>
  </dialog>

</main>
</body>
</html>
