<body class="backoffice" data-panel="admin" data-nav="forms">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">
<form>

  <div class="bo-page-head">
    <div>
      <a href="forms.html" style="font-size:13px" data-i18n="fme.back"></a>
      <h1>Bordro Ek Bilgileri</h1>
      <p data-i18n="fme.sub"></p>
    </div>
    <div class="actions">
      <button type="button" class="rd-btn rd-btn-danger" data-dialog-open="dlg-deletedata" data-i18n="common.delete"></button>
      <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
      <button type="submit" class="rd-btn rd-btn-primary" data-i18n="common.save"></button>
    </div>
  </div>

  <div class="rd-surface" style="margin-bottom:20px">
    <div class="rd-surface-body" style="max-width:720px">
      <div class="rd-field">
        <label class="rd-label" for="fme-title" data-i18n="fme.titleLabel"></label>
        <input id="fme-title" class="rd-control" value="Bordro Ek Bilgileri">
        <div class="rd-help" data-i18n="fme.titleHelp"></div>
      </div>
      <div class="rd-field mb-0">
        <label class="rd-label" for="fme-instr" data-i18n="fme.instructions"></label>
        <textarea id="fme-instr" class="rd-control" style="min-height:80px">Bordro talebinizle ilgili ek bilgileri doldurun; personel numarası zorunludur.</textarea>
        <div class="rd-help" data-i18n="fme.instructionsHelp"></div>
      </div>
    </div>
  </div>

  <div class="rd-surface" style="margin-bottom:20px">
    <div class="rd-surface-head"><span data-i18n="fme.fieldsHead"></span></div>
    <table class="rd-table" id="tbl-fields">
      <thead>
        <tr>
          <th style="width:30px"></th>
          <th data-i18n="fme.colLabel"></th>
          <th data-i18n="fme.colType"></th>
          <th data-i18n="fme.colVar"></th>
          <th data-i18n="fme.colRequired"></th>
          <th data-i18n="fme.colInternal"></th>
          <th style="width:36px"></th>
          <th style="width:36px"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="rd-muted" style="cursor:grab">⋮⋮</td>
          <td><input class="rd-control" value="Personel Numarası" style="min-width:170px"></td>
          <td>
            <select class="rd-control" style="min-width:130px">
              <option selected data-i18n="fme.tShort"></option>
              <option data-i18n="fme.tLong"></option>
              <option data-i18n="fme.tChoice"></option>
              <option data-i18n="fme.tDate"></option>
              <option data-i18n="fme.tCheckbox"></option>
              <option data-i18n="fme.tPhone"></option>
              <option data-i18n="fme.tFile"></option>
            </select>
          </td>
          <td><input class="rd-control" value="personel_no" style="min-width:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></td>
          <td><input type="checkbox" checked></td>
          <td><input type="checkbox"></td>
          <td><button type="button" style="border:0;background:transparent;cursor:pointer;font-size:15px" data-dialog-open="dlg-fieldcfg" data-i18n-title="fme.cfgTitle">⚙</button></td>
          <td><button type="button" style="border:0;background:transparent;color:var(--rd-red);cursor:pointer" data-i18n-title="common.delete">✕</button></td>
        </tr>
        <tr>
          <td class="rd-muted" style="cursor:grab">⋮⋮</td>
          <td><input class="rd-control" value="Dönem" style="min-width:170px"></td>
          <td>
            <select class="rd-control" style="min-width:130px">
              <option data-i18n="fme.tShort"></option>
              <option data-i18n="fme.tLong"></option>
              <option data-i18n="fme.tChoice"></option>
              <option selected data-i18n="fme.tDate"></option>
              <option data-i18n="fme.tCheckbox"></option>
              <option data-i18n="fme.tPhone"></option>
              <option data-i18n="fme.tFile"></option>
            </select>
          </td>
          <td><input class="rd-control" value="donem" style="min-width:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></td>
          <td><input type="checkbox" checked></td>
          <td><input type="checkbox"></td>
          <td><button type="button" style="border:0;background:transparent;cursor:pointer;font-size:15px" data-dialog-open="dlg-fieldcfg" data-i18n-title="fme.cfgTitle">⚙</button></td>
          <td><button type="button" style="border:0;background:transparent;color:var(--rd-red);cursor:pointer" data-i18n-title="common.delete">✕</button></td>
        </tr>
        <tr>
          <td class="rd-muted" style="cursor:grab">⋮⋮</td>
          <td><input class="rd-control" value="Modül" style="min-width:170px"></td>
          <td>
            <select class="rd-control" style="min-width:130px">
              <option data-i18n="fme.tShort"></option>
              <option data-i18n="fme.tLong"></option>
              <option selected data-i18n="fme.tChoice"></option>
              <option data-i18n="fme.tDate"></option>
              <option data-i18n="fme.tCheckbox"></option>
              <option data-i18n="fme.tPhone"></option>
              <option data-i18n="fme.tFile"></option>
            </select>
          </td>
          <td><input class="rd-control" value="modul" style="min-width:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></td>
          <td><input type="checkbox"></td>
          <td><input type="checkbox"></td>
          <td><button type="button" style="border:0;background:transparent;cursor:pointer;font-size:15px" data-dialog-open="dlg-fieldcfg" data-i18n-title="fme.cfgTitle">⚙</button></td>
          <td><button type="button" style="border:0;background:transparent;color:var(--rd-red);cursor:pointer" data-i18n-title="common.delete">✕</button></td>
        </tr>
        <tr>
          <td class="rd-muted" style="cursor:grab">⋮⋮</td>
          <td><input class="rd-control" value="Ek Açıklama" style="min-width:170px"></td>
          <td>
            <select class="rd-control" style="min-width:130px">
              <option data-i18n="fme.tShort"></option>
              <option selected data-i18n="fme.tLong"></option>
              <option data-i18n="fme.tChoice"></option>
              <option data-i18n="fme.tDate"></option>
              <option data-i18n="fme.tCheckbox"></option>
              <option data-i18n="fme.tPhone"></option>
              <option data-i18n="fme.tFile"></option>
            </select>
          </td>
          <td><input class="rd-control" value="ek_aciklama" style="min-width:130px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace"></td>
          <td><input type="checkbox"></td>
          <td><input type="checkbox" checked></td>
          <td><button type="button" style="border:0;background:transparent;cursor:pointer;font-size:15px" data-dialog-open="dlg-fieldcfg" data-i18n-title="fme.cfgTitle">⚙</button></td>
          <td><button type="button" style="border:0;background:transparent;color:var(--rd-red);cursor:pointer" data-i18n-title="common.delete">✕</button></td>
        </tr>
      </tbody>
    </table>
    <div class="rd-surface-body" style="border-top:1px solid var(--rd-border-soft)">
      <button type="button" class="rd-btn rd-btn-ghost" data-i18n="fme.addField"></button>
      <div class="rd-help" data-i18n="fme.fieldsHelp"></div>
    </div>
  </div>

  <div class="rd-surface">
    <div class="rd-surface-body" style="max-width:720px">
      <div class="rd-field mb-0">
        <label class="rd-label" for="fme-notes" data-i18n="common.notes"></label>
        <textarea id="fme-notes" class="rd-control" style="min-height:80px">İK ekibinin isteğiyle eklendi; Bordro yardım konularına bağlıdır.</textarea>
        <div class="rd-help" data-i18n="common.notesHelp"></div>
      </div>
    </div>
  </div>

</form>

  <!-- Alan ayarları -->
  <dialog class="rd-dialog" id="dlg-fieldcfg">
    <form>
      <div class="rd-dialog-head"><span data-i18n="fme.cfgTitle"></span><button type="button" class="close" data-dialog-close>✕</button></div>
      <div class="rd-dialog-body">
        <div class="rd-field">
          <label class="rd-label" for="cfg-help" data-i18n="fme.cfgHelpText"></label>
          <input id="cfg-help" class="rd-control" value="Bordronuzun sağ üst köşesindeki 6 haneli numara.">
          <div class="rd-help" data-i18n="fme.cfgHelpTextHelp"></div>
        </div>
        <div class="rd-field">
          <label class="rd-label" for="cfg-default" data-i18n="fme.cfgDefault"></label>
          <input id="cfg-default" class="rd-control">
          <div class="rd-help" data-i18n="fme.cfgDefaultHelp"></div>
        </div>
        <div class="rd-field mb-0">
          <label class="rd-label" for="cfg-validation" data-i18n="fme.cfgValidation"></label>
          <select id="cfg-validation" class="rd-control">
            <option selected data-i18n="fme.vNone"></option>
            <option data-i18n="fme.vEmail"></option>
            <option data-i18n="fme.vPhone"></option>
            <option data-i18n="fme.vNumber"></option>
          </select>
          <div class="rd-help" data-i18n="fme.cfgValidationHelp"></div>
        </div>
      </div>
      <div class="rd-dialog-foot">
        <button type="button" class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
        <button type="button" class="rd-btn rd-btn-primary" data-dialog-close data-i18n="common.apply"></button>
      </div>
    </form>
  </dialog>

  <!-- Veriyle birlikte silme onayı -->
  <dialog class="rd-dialog" id="dlg-deletedata">
    <div class="rd-dialog-head"><span data-i18n="common.delete"></span><button class="close" data-dialog-close>✕</button></div>
    <div class="rd-dialog-body">
      <div class="rd-banner rd-banner-warn"><span>⚠</span><span data-i18n="fme.deleteWarn"></span></div>
    </div>
    <div class="rd-dialog-foot">
      <button class="rd-btn" data-dialog-close data-i18n="common.cancel"></button>
      <button class="rd-btn rd-btn-danger" data-dialog-close data-i18n="common.delete"></button>
    </div>
  </dialog>

</main>
</body>
</html>
