<main class="bo-main">

      <h1>Kıdemli Temsilci</h1>
      <p data-i18n="re.subtitle"></p>
    </div>
  </div>

    <div class="rd-tabs" data-tabs data-tabs-scope="main">
      <button type="button" class="active" data-tab="panel-def" data-i18n="re.tabDef"></button>
      <button type="button" data-tab="panel-perms" data-i18n="re.tabPerms"></button>
    </div>

    <!-- ============ Tanım ============ -->
    <div class="rd-tab-panel active" id="panel-def" data-tab-group="main">
      <div class="rd-surface">
        <div class="rd-surface-head" data-i18n="re.secDef"></div>
        <div class="rd-surface-body">
          <div class="rd-field">
            <label class="rd-label" for="re-name" data-i18n="re.name"></label>
            <input id="re-name" class="rd-control" type="text" value="Kıdemli Temsilci" style="max-width:380px">
            <p class="rd-help" data-i18n="re.nameHelp"></p>
          </div>
          <div class="rd-field mb-0">
            <label class="rd-label" for="re-notes" data-i18n="common.notes"></label>
            <textarea id="re-notes" class="rd-control" style="min-height:80px">Silme dışında tüm talep yetkileri; kullanıcı ve şirket kayıtlarını düzenleyebilir.</textarea>
            <p class="rd-help" data-i18n="common.notesHelp"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ İzinler ============ -->
    <div class="rd-tab-panel" id="panel-perms" data-tab-group="main">

      <!-- Talepler (14) -->
      <div class="bo-toggle-card">
        <div class="head">
          <div>
            <b data-i18n="re.grpTickets"></b>
            <small data-i18n="re.grpTicketsHelp"></small>
          </div>
          <label class="rd-switch"><input type="checkbox" checked><span class="track"></span></label>
        </div>
        <div class="recipients">
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pCreate"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pEdit"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pAssign"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pRelease"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pTransfer"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pRefer"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pMerge"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pLink"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pReplySend"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pEffortPropose"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pMarkAnswered"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pClose"></span></label>
          <label class="rd-check"><input type="checkbox"><span data-i18n="re.pDelete"></span></label>
          <label class="rd-check"><input type="checkbox"><span data-i18n="re.pEditThread"></span></label>

          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pDirectory"></span></label>
        </div>
      </div>

      <!-- Şirketler (3) -->

        <div class="head">
          <div>
            <b data-i18n="re.grpOrgs"></b>
            <small data-i18n="re.grpOrgsHelp"></small>
          </div>
          <label class="rd-switch"><input type="checkbox" checked><span class="track"></span></label>
        </div>
        <div class="recipients">
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pCreate"></span></label>
          <label class="rd-check"><input type="checkbox" checked><span data-i18n="re.pEdit"></span></label>
          <label class="rd-check"><input type="checkbox"><span data-i18n="re.pDelete"></span></label>
        </div>
      </div>

      <!-- Bilgi Bankası (2) -->
