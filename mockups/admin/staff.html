</head>
<body class="backoffice" data-panel="admin" data-nav="staff">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>
<main class="bo-main">

  <div class="bo-page-head">
    <div>
      <h1 data-i18n="sf.title"></h1>
      <p data-i18n="sf.subtitle"></p>
    </div>
    <div class="actions">
      <a class="rd-btn-primary" href="staff-edit.html" data-i18n="sf.add"></a>
    </div>
  </div>

  <div class="rd-list-toolbar">
    <input type="search" class="rd-control" data-i18n-placeholder="sf.searchPh">
    <select class="rd-control">
      <option selected data-i18n="sf.fltDeptAll"></option>
      <option>Destek</option>
      <option>Bordro</option>
      <option>Danışmanlık</option>
    </select>
    <select class="rd-control">
      <option selected data-i18n="sf.fltTeamAll"></option>
      <option>Bordro Ekibi</option>
      <option>VIP Masası</option>
      <option>Entegrasyon</option>
    </select>
    <button class="rd-btn" data-i18n="common.apply"></button>
    <span class="spacer"></span>
    <button class="rd-btn" data-i18n="common.enable"></button>
    <button class="rd-btn" data-i18n="sf.lock"></button>
    <button class="rd-btn" data-i18n="common.export"></button>
    <button class="rd-btn rd-btn-danger" data-i18n="common.delete"></button>
  </div>

  <div class="rd-surface" id="tbl-staff">
    <table class="rd-table">
      <thead>
        <tr>
          <th class="col-check"><input type="checkbox" data-check-all="#tbl-staff" data-i18n-title="common.selectAll"></th>
          <th class="sortable sorted-desc" data-i18n="sf.colName"></th>
          <th class="sortable" data-i18n="sf.colUsername"></th>
          <th class="sortable" data-i18n="common.status"></th>
          <th class="sortable" data-i18n="sf.colDept"></th>
          <th class="sortable" data-i18n="sf.colRole"></th>
          <th class="sortable" data-i18n="sf.colLastLogin"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td>
            <span style="display:inline-flex;align-items:center;gap:10px">
              <span class="rd-avatar">ÜA</span>
              <a href="staff-edit.html">Ümit Y. Akın</a>
            </span>
          </td>
          <td>uakin</td>
          <td><span class="rd-pill rd-pill-solved" data-i18n="sf.stActive"></span></td>
          <td>Bordro</td>
          <td>Yönetici</td>
          <td>11.08.2026 09:12</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td>
            <span style="display:inline-flex;align-items:center;gap:10px">
              <span class="rd-avatar">MÇ</span>
              <a href="staff-edit.html">Merve Çetin</a>
            </span>
          </td>
          <td>mcetin</td>
          <td><span class="rd-pill rd-pill-solved" data-i18n="sf.stActive"></span></td>
          <td>Destek</td>
          <td>Kıdemli Temsilci</td>
          <td>11.08.2026 08:47</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td>
            <span style="display:inline-flex;align-items:center;gap:10px">
              <span class="rd-avatar">DK</span>
              <a href="staff-edit.html">Deniz Kaya</a>
            </span>
          </td>
          <td>dkaya</td>
          <td><span class="rd-pill rd-pill-overdue" data-i18n="sf.stLocked"></span></td>
          <td>Destek</td>
          <td>Temsilci</td>
          <td>03.08.2026 15:31</td>
        </tr>
        <tr>
          <td class="col-check"><input type="checkbox"></td>
          <td>
            <span style="display:inline-flex;align-items:center;gap:10px">
              <span class="rd-avatar">ZA</span>
              <a href="staff-edit.html">Selin Aydın</a>
            </span>
          </td>
          <td>saydin</td>
          <td><span class="rd-pill rd-pill-wait" data-i18n="sf.stVacation"></span></td>
          <td>Bordro</td>
          <td>Temsilci</td>
          <td>10.08.2026 17:03</td>
        </tr>
      </tbody>
    </table>
    <div class="rd-pagination">
      <span data-i18n="common.showing"></span><span>1–4 / 4</span>
      <div class="pages"><span class="current">1</span></div>
    </div>
  </div>

  <!-- Empty-state variant (hidden) -->
  <div class="rd-tab-panel" id="empty-staff">
    <div class="rd-surface">
      <div class="rd-empty">
        <div class="icon">◍</div>
        <h3 data-i18n="sf.emptyTitle"></h3>
        <p data-i18n="sf.emptyText"></p>
        <a class="rd-btn-primary" href="staff-edit.html" data-i18n="sf.add"></a>
      </div>
    </div>
  </div>

</main>
</body>
</html>
