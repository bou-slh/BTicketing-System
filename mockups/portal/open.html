<body class="portal" data-panel="portal" data-nav="new">
<div id="rd-header"></div>

<main class="rc-main">
  <div class="rc-heading">
    <div>
      <h1 data-i18n="open.title"></h1>
      <p data-i18n="open.sub"></p>
    </div>
  </div>

  <div class="rc-form-layout">
    <form class="rc-form">
      <div class="rc-form-grid">
        <div class="rc-form-step"><span class="rc-step-icon">1</span><span data-i18n="open.step1"></span></div>

        <div>
          <label class="rc-label" for="rc-company" data-i18n="open.customer"></label>
          <input id="rc-company" class="rc-control" value="RapidSol" readonly>
        </div>
        <div>
          <label class="rc-label" for="rc-topic" data-i18n="open.topic"></label>
          <select id="rc-topic" class="rc-control">
            <option value="" data-i18n="open.topicSelect"></option>
            <option data-i18n="open.topicChange"></option>
            <option data-i18n="open.topicBug"></option>
            <option data-i18n="open.topicConsult"></option>
            <option data-i18n="open.topicLegal"></option>
          </select>
          <div class="rd-help" data-i18n="open.topicHelp"></div>
        </div>
        <div>
          <label class="rc-label" for="rc-summary" data-i18n="open.summary"></label>
          <input id="rc-summary" class="rc-control" data-i18n-placeholder="open.summaryPh">
        </div>

        <div class="rc-form-step"><span class="rc-step-icon">2</span><span data-i18n="open.step2"></span></div>

        <div>
          <label class="rc-label" for="rc-priority" data-i18n="open.priority"></label>
          <select id="rc-priority" class="rc-control">
            <option data-i18n="open.prNormal"></option>
            <option data-i18n="open.prHigh"></option>
            <option data-i18n="open.prCritical"></option>
          </select>
        </div>
        <div>
          <label class="rc-label" for="rc-reference" data-i18n="open.reference"></label>
          <input id="rc-reference" class="rc-control" data-i18n-placeholder="open.referencePh">
        </div>
        <div>
          <label class="rc-label" for="rc-details" data-i18n="open.details"></label>
          <textarea id="rc-details" class="rc-control" data-i18n-placeholder="open.detailsPh"></textarea>
        </div>

        <div class="rc-form-step"><span class="rc-step-icon">3</span><span data-i18n="open.step3"></span></div>

        <label class="rc-upload" for="rc-new-files">
          <span data-i18n="open.upload"></span>
          <input id="rc-new-files" type="file" multiple hidden>
        </label>
      </div>

      <div class="rc-form-footer">
        <small data-i18n="open.eta"></small>
        <button class="rc-button-primary" data-i18n="open.submit"></button>
      </div>
    </form>

    <aside class="rc-surface">
      <div class="rc-aside-block">
        <h3 data-i18n="open.tipsTitle"></h3>
        <div class="rc-aside-tip"><span>✓</span><div data-i18n="open.tip1"></div></div>
        <div class="rc-aside-tip"><span>✓</span><div data-i18n="open.tip2"></div></div>
        <div class="rc-aside-tip"><span>✓</span><div data-i18n="open.tip3"></div></div>
        <div class="rc-notice" data-i18n="open.notice"></div>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
