<body class="backoffice" data-panel="agent" data-nav="tickets">
<div id="rd-topbar"></div>
<div id="rd-sidebar"></div>

<main class="bo-main" style="max-width:880px">
  <div class="bo-page-head rc-hero">
    <div>
      <h1 data-i18n="to.title"></h1>
      <p data-i18n="to.sub"></p>
    </div>
  </div>

  <form style="display:flex;flex-direction:column;gap:20px">

    <!-- 1. User -->
    <div class="rd-surface">
      <div class="rd-surface-head" data-i18n="to.secUser"></div>
      <div class="rd-surface-body">
        <div class="rd-field">
          <label class="rd-label" data-i18n="to.userSearch"></label>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <input class="rd-control" style="flex:1;min-width:220px" data-i18n-placeholder="to.userSearchPh" value="Bourla Salehi — bourla.salehi@ulasim.com.tr">
            <button type="button" class="rd-btn rd-btn-ghost" data-i18n="to.newUser"></button>
          </div>
        </div>
        <div class="rd-field">
          <label class="rd-label" data-i18n="to.cc"></label>
          <input class="rd-control" data-i18n-placeholder="to.ccPh" value="ik@ulasim.com.tr">
        </div>
        <div class="rd-field" style="margin-bottom:0">
          <span class="rd-label" data-i18n="to.notify"></span>
          <div style="display:flex;flex-wrap:wrap;gap:9px 22px">
            <label class="rd-check"><input type="radio" name="notify" checked><span data-i18n="to.notifyAll"></span></label>
            <label class="rd-check"><input type="radio" name="notify"><span data-i18n="to.notifyUser"></span></label>
            <label class="rd-check"><input type="radio" name="notify"><span data-i18n="to.notifyNone"></span></label>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Ticket info -->
    <div class="rd-surface">
      <div class="rd-surface-head" data-i18n="to.secInfo"></div>
      <div class="rd-surface-body">
        <div class="rd-grid-2">
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.source"></label>
            <select class="rd-control">
              <option data-i18n="to.srcPhone"></option>
              <option data-i18n="to.srcEmail"></option>
              <option data-i18n="to.srcWeb"></option>
              <option data-i18n="to.srcOther"></option>
            </select>
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.topic"></label>
            <select class="rd-control">
              <option data-i18n="to.select"></option>
              <option selected>Bordro</option>
              <option>Bordro / Yol Ücreti</option>
              <option>İzin</option>
              <option>Vardiya</option>
              <option>Danışmanlık</option>
            </select>
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.dept"></label>
            <select class="rd-control">
              <option>Destek</option>
              <option selected>Bordro</option>
              <option>Danışmanlık</option>
            </select>
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.sla"></label>
            <select class="rd-control">
              <option selected>Standart (24 saat)</option>
              <option>Öncelikli (8 saat)</option>
              <option>VIP (4 saat)</option>
            </select>
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.due"></label>
            <input class="rd-control" type="date" value="2026-08-13">
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.assign"></label>
            <select class="rd-control">
              <option data-i18n="to.select"></option>
              <optgroup label="Temsilciler">
                <option>Ümit Y. Akın</option>
                <option>Merve Çetin</option>
                <option>Deniz Kaya</option>
              </optgroup>
              <optgroup label="Takımlar">
                <option>Bordro Ekibi</option>
                <option>Destek Ekibi</option>
              </optgroup>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. Subject + details -->
    <div class="rd-surface">
      <div class="rd-surface-head" data-i18n="to.secSubject"></div>
      <div class="rd-surface-body">
        <div class="rd-grid-2">
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.summary"></label>
            <input class="rd-control" data-i18n-placeholder="to.summaryPh">
          </div>
          <div class="rd-field">
            <label class="rd-label" data-i18n="to.priority"></label>
            <select class="rd-control">
              <option data-i18n="priority.low"></option>
              <option selected data-i18n="priority.normal"></option>
              <option data-i18n="priority.high"></option>
              <option data-i18n="priority.emergency"></option>
            </select>
          </div>
        </div>
        <div class="rd-field">
          <label class="rd-label" data-i18n="to.details"></label>
          <textarea class="rd-control" style="min-height:140px" data-i18n-placeholder="to.detailsPh"></textarea>
        </div>
        <label class="rd-upload" style="display:block;margin-bottom:0">
          <span data-i18n="to.upload"></span>
          <input type="file" multiple hidden>
        </label>

        <!-- 4. First response + note (advanced) -->
        <details class="rd-advanced">
          <summary data-i18n="to.secFirst"></summary>
          <div class="rd-advanced-body">
            <div class="rd-field">
              <label class="rd-label" data-i18n="to.canned"></label>
              <select class="rd-control">
                <option data-i18n="to.cannedPh"></option>
                <option>Bordro düzeltme bilgilendirmesi</option>
                <option>Efor onayı hatırlatması</option>
              </select>
            </div>
            <div class="rd-field">
              <label class="rd-label" data-i18n="to.replyLabel"></label>
              <textarea class="rd-control" data-i18n-placeholder="to.replyPh"></textarea>
            </div>
            <div class="rd-field">
              <span class="rd-label" data-i18n="to.signature"></span>
              <div style="display:flex;flex-wrap:wrap;gap:9px 22px">
                <label class="rd-check"><input type="radio" name="sig" checked><span data-i18n="to.sigNone"></span></label>
                <label class="rd-check"><input type="radio" name="sig"><span data-i18n="to.sigMine"></span></label>
                <label class="rd-check"><input type="radio" name="sig"><span data-i18n="to.sigDept"></span></label>
              </div>
            </div>
            <div class="rd-field" style="margin-bottom:0">
              <label class="rd-label" data-i18n="to.note"></label>
              <textarea class="rd-control" data-i18n-placeholder="to.notePh"></textarea>
              <div class="rd-help" data-i18n="common.notesHelp"></div>
            </div>
          </div>
        </details>
      </div>
    </div>

    <!-- Footer -->
    <div style="display:flex;gap:10px;align-items:center">
      <button type="submit" class="rd-btn-primary" data-i18n="to.open"></button>
      <button type="reset" class="rd-btn" data-i18n="common.reset"></button>
      <a class="rd-btn rd-btn-ghost" href="tickets.html" data-i18n="common.cancel"></a>
    </div>
  </form>
</main>

</body>
</html>
